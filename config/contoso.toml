# Cloud Cost to User & Product Impact Analyzer - configuration
# One file describes an organization: where its data is, how resources map to apps,
# and how each app's cost should be split. Copy this file to start your own.

[organization]
name = "Contoso Retail India"
description = "Azure spend for 5,000 employees and four customer-facing products, traced from the bill to the people and transactions behind it."
footer = "Synthetic data for a fictional company, generated by cloud-impact-analyzer. Costs in USD, FOCUS 1.0 format."
currency_symbol = "$"

# Inputs. Each entry is a table name in the database, a file path (.csv or .parquet, globs allowed), or "" if you don't have it.
# Only `cost` is required. Everything else unlocks more analysis (see README, "Data levels").
[data]
database = "data/synthetic/cloud_impact.duckdb"
cost = "focus_cost"                         # FOCUS 1.0 cost export
inventory = "resources"                     # resource list with app, environment, SKU, deletion date
sessions = "sessions"                       # one row per user session
users = "users"                             # user_id -> team
activity = "business_metrics"               # daily activity per app
metrics = "resource_daily_metrics"          # daily running hours and CPU per resource
ground_truth = "anomalies_ground_truth"     # answer key; synthetic data only

# The company-wide business number the cost is compared against
[headline]
label = "orders"            # shown as "Per 1,000 orders"
scale = 1000

[allocation]
session_weight = "hours_x_cpu"   # hours_x_cpu | hours | count
shared_split = "proportional"    # proportional (by each app's own cost) | even

# How resources are assigned to apps, tried in order. The first match wins; anything unmatched is reported as "unmapped".
[mapping]
use_inventory = true
rules = [
  { type = "tag", key = "app" },     # tag value matches an app's id, name or alias
]

# Apps. split: sessions_by_host (desktops/VMs users log into) | sessions (split by usage over the month) | owner (charge the owner team)
# role = "shared" means platform cost spread across all apps. unit: active_users | transactions | none
# group (optional) sets the heading the app is listed under in the dashboard
[[apps]]
id = "A01"
group = "Virtual desktops"
name = "AVD Contact Center Desktops"
team = "IT"
split = "sessions_by_host"
unit = "active_users"

