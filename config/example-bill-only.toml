# Level 1 example: only a FOCUS cost export, mapped to apps through tags.
# Shows what the analyzer gives an organization before it shares any activity data.
# Run with: python -m attribution --config config/example-bill-only.toml

[organization]
name = "Contoso Retail India (bill only)"
description = "Azure spend analyzed from the FOCUS bill alone, mapped to apps through resource tags."
footer = "Synthetic data, Level 1 (cost export only). Costs in USD, FOCUS 1.0 format."
currency_symbol = "$"

[data]
database = "data/bill-only/analyzer.duckdb"       # results go in their own database
cost = "data/synthetic/focus_cost.parquet"        # a FOCUS export file, as an organization would provide it
inventory = ""
sessions = ""
users = ""
activity = ""
metrics = ""
ground_truth = ""

[headline]
label = "transactions"
scale = 1000

[allocation]
session_weight = "hours_x_cpu"
shared_split = "proportional"

[mapping]
use_inventory = false
rules = [
  { type = "tag", key = "app" },
  { type = "resource_group", pattern = "rg-shared-platform-*", app = "A20" },
  { type = "resource_group", pattern = "rg-backup-dr-*", app = "A19" },
]

[[apps]]
id = "A01"
name = "AVD Contact Center Desktops"
team = "IT"

